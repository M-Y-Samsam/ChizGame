                <input type="password" [formControl]="PasswordCtrl" matInput>
                <mat-hint>Enter Your Password</mat-hint>
            </mat-form-field>
        </div>

        <button mat-button (click)="login(); loginIsCliging = true" [class.login-click]="loginIsCliging"
            class="login-button" (animationend)="loginIsCliging= false" type="submit" color="accent"
            [disabled]="loginFg.invalid">
            <mat-icon matIconPrefix>person</mat-icon>
            Login
        </button>
    </form>
</section>
